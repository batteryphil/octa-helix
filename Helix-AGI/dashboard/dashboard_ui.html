<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helix — Cognitive Dashboard</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg: #0a0e17; --panel: #111827; --border: #1e293b;
    --text: #e2e8f0; --dim: #64748b; --accent: #3b82f6;
    --gold: #fbbf24; --green: #4ade80; --red: #f87171;
    --purple: #a78bfa; --pink: #f472b6; --orange: #fb923c;
  }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', sans-serif; height: 100vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    padding: 12px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px;
  }
  header h1 {
    font-size: 16px; font-weight: 600; letter-spacing: 2px;
    background: linear-gradient(90deg, var(--accent), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .status-badge {
    padding: 3px 10px; border-radius: 12px; font-size: 11px;
    font-weight: 500; letter-spacing: 1px;
    background: rgba(74,222,128,0.15); color: var(--green); border: 1px solid rgba(74,222,128,0.3);
  }
  .status-badge.dormant { background: rgba(100,116,139,0.15); color: var(--dim); border-color: rgba(100,116,139,0.3); }
  .status-badge.active  { background: rgba(59,130,246,0.15);  color: var(--accent); border-color: rgba(59,130,246,0.3); }
  .status-badge.resting { background: rgba(74,222,128,0.12);  color: var(--green);  border-color: rgba(74,222,128,0.25); }
  .status-badge.regular { background: rgba(251,191,36,0.15);  color: var(--gold);   border-color: rgba(251,191,36,0.3); }
  .pulse-count { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--dim); }

  /* ── Health indicator ── */
  .health-block {
    margin-left: auto; display: flex; align-items: center; gap: 10px;
  }
  .health-dot {
    width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0;
    background: var(--dim);
  }
  .health-dot.alive {
    background: #22c55e;
    box-shadow: 0 0 0 0 rgba(34,197,94,0.7);
    animation: pulse-alive 2s ease-in-out infinite;
  }
  .health-dot.stale {
    background: var(--gold);
    box-shadow: 0 0 6px rgba(251,191,36,0.6);
  }
  .health-dot.crashed {
    background: var(--red);
    box-shadow: 0 0 0 0 rgba(248,113,113,0.7);
    animation: pulse-crashed 0.8s ease-in-out infinite;
  }
  @keyframes pulse-alive {
    0%   { box-shadow: 0 0 0 0   rgba(34,197,94,0.7); }
    70%  { box-shadow: 0 0 0 8px rgba(34,197,94,0);   }
    100% { box-shadow: 0 0 0 0   rgba(34,197,94,0);   }
  }
  @keyframes pulse-crashed {
    0%,100% { opacity: 1; }
    50%     { opacity: 0.3; }
  }
  .health-label {
    font-family: 'JetBrains Mono', monospace; font-size: 11px; line-height: 1.3;
  }
  .health-label .health-status { font-weight: 600; }
  .health-label .health-status.alive   { color: #22c55e; }
  .health-label .health-status.stale   { color: var(--gold); }
  .health-label .health-status.crashed { color: var(--red); }
  .health-label .health-status.unknown { color: var(--dim); }
  .health-label .health-ago { font-size: 10px; color: var(--dim); display: block; }

  .main { display: flex; flex: 1; overflow: hidden; }

  /* Left panel: logs */
  .log-panel {
    width: 35%; min-width: 300px; display: flex; flex-direction: column;
    border-right: 1px solid var(--border);
  }
  .tab-bar {
    display: flex; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .tab-bar button {
    flex: 1; padding: 8px 4px; background: none; border: none;
    color: var(--dim); font-size: 11px; font-weight: 500;
    cursor: pointer; border-bottom: 2px solid transparent;
    font-family: 'Inter', sans-serif; letter-spacing: 0.5px;
    transition: all 0.2s;
  }
  .tab-bar button.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab-bar button:hover { color: var(--text); }
  .log-content {
    flex: 1; overflow-y: auto; padding: 8px 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    line-height: 1.6; background: var(--bg);
  }
  .log-content::-webkit-scrollbar { width: 6px; }
  .log-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .log-line { padding: 1px 0; word-wrap: break-word; }
  .log-line.warn { color: var(--gold); }
  .log-line.error { color: var(--red); }
  .log-line .ts { color: var(--dim); }

  /* Center: 3D scene */
  .scene-panel {
    flex: 1; position: relative; background: var(--bg);
    border-right: 1px solid var(--border);
  }
  #three-canvas { width: 100%; height: 100%; display: block; }
  .scene-label {
    position: absolute; top: 8px; left: 12px; font-size: 10px;
    color: var(--dim); letter-spacing: 1px; font-weight: 500;
    pointer-events: none;
  }
  #tooltip {
    position: absolute; display: none; padding: 6px 10px;
    background: rgba(17,24,39,0.95); border: 1px solid var(--border);
    border-radius: 6px; font-size: 11px; max-width: 280px;
    pointer-events: none; z-index: 10; color: var(--text);
    font-family: 'JetBrains Mono', monospace; line-height: 1.4;
  }
  .legend {
    position: absolute; bottom: 12px; left: 12px; display: flex;
    flex-wrap: wrap; gap: 8px; pointer-events: none;
  }
  .legend-item {
    display: flex; align-items: center; gap: 4px;
    font-size: 10px; color: var(--dim);
  }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* Right: gauges */
  .gauge-panel {
    width: 220px; min-width: 200px; padding: 16px;
    background: var(--panel); overflow-y: auto;
    display: flex; flex-direction: column; gap: 16px;
  }
  .gauge-section { }
  .gauge-section h3 {
    font-size: 10px; letter-spacing: 1.5px; color: var(--dim);
    margin-bottom: 10px; font-weight: 500;
  }
  .gauge {
    margin-bottom: 10px;
  }
  .gauge-header {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 4px;
  }
  .gauge-label { font-size: 12px; font-weight: 500; }
  .gauge-value {
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    color: var(--accent);
  }
  .gauge-bar {
    height: 6px; background: var(--border); border-radius: 3px;
    overflow: hidden;
  }
  .gauge-fill {
    height: 100%; border-radius: 3px; transition: width 0.8s ease;
    background: linear-gradient(90deg, var(--accent), var(--purple));
  }
  .gauge-fill.omega { background: linear-gradient(90deg, var(--red), var(--gold), var(--green)); }
  .gauge-fill.gamma { background: linear-gradient(90deg, var(--green), var(--accent)); }

  .cat-list { list-style: none; }
  .cat-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 3px 0; font-size: 11px;
  }
  .cat-name { display: flex; align-items: center; gap: 6px; }
  .cat-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .cat-count {
    font-family: 'JetBrains Mono', monospace; color: var(--dim);
    font-size: 11px;
  }

  /* Chat panel (hidden by default, shown when Chat tab active) */
  /* ── Activation Panel ── */
  .activation-section {}
  .ekg-wrap {
    background: #060b14; border: 1px solid #1e293b;
    border-radius: 6px; padding: 6px; margin-bottom: 10px;
  }
  #ekg-canvas { display: block; width: 100%; height: 60px; }
  .act-bar-row {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 6px;
  }
  .act-bar-label {
    font-size: 10px; color: var(--dim); width: 80px; flex-shrink: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .act-bar-track {
    flex: 1; height: 8px; background: #0d1626;
    border-radius: 4px; overflow: hidden;
  }
  .act-bar-fill {
    height: 100%; border-radius: 4px;
    transition: width 1.2s cubic-bezier(.4,0,.2,1);
    background: linear-gradient(90deg, #3b82f6, #8b5cf6);
    box-shadow: 0 0 6px #3b82f688;
  }
  .act-bar-fill.high { background: linear-gradient(90deg, #10b981, #3b82f6); box-shadow: 0 0 8px #10b98188; }
  .act-bar-fill.zero { background: #1e293b; box-shadow: none; }
  .act-event-row {
    font-size: 10px; color: var(--dim); padding: 2px 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .act-event-row span { color: #7dd3fc; }
  .chat-panel {
    display: none; flex-direction: column; flex: 1;
    background: var(--bg); min-height: 0;
  }
  .chat-panel.visible { display: flex; }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 10px 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    line-height: 1.6;
  }
  .chat-messages::-webkit-scrollbar { width: 6px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .chat-msg {
    margin-bottom: 8px; padding: 6px 10px; border-radius: 8px;
    max-width: 90%; word-wrap: break-word;
  }
  .chat-msg.inbound {
    background: rgba(59,130,246,0.12); border: 1px solid rgba(59,130,246,0.25);
    align-self: flex-end; margin-left: auto;
  }
  .chat-msg.outbound {
    background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.2);
  }
  .chat-msg .chat-sender { font-size: 10px; color: var(--dim); margin-bottom: 2px; }
  .chat-msg .chat-time { font-size: 9px; color: var(--dim); float: right; margin-left: 12px; }
  .chat-input-bar {
    display: flex; gap: 6px; padding: 8px 12px;
    border-top: 1px solid var(--border); background: var(--panel);
  }
  .chat-input-bar input[type="text"] {
    flex: 1; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; color: var(--text);
    font-family: 'JetBrains Mono', monospace; font-size: 11px;
    outline: none;
  }
  .chat-input-bar input[type="text"]:focus { border-color: var(--accent); }
  .chat-input-bar .sender-input {
    width: 80px; text-align: center; flex: none;
  }
  .chat-input-bar button {
    background: var(--accent); border: none; color: white;
    padding: 6px 14px; border-radius: 6px; cursor: pointer;
    font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 500;
    transition: background 0.2s;
  }
  .chat-input-bar button:hover { background: #2563eb; }
</style>
</head>
<body>
<header>
  <h1>HELIX COGNITIVE DASHBOARD</h1>
  <span id="state-badge" class="status-badge">UNKNOWN</span>
  <span class="pulse-count">Pulse <span id="pulse-num">—</span></span>
  <!-- ── Health indicator ── -->
  <div class="health-block">
    <div id="health-dot" class="health-dot"></div>
    <div class="health-label">
      <span id="health-status" class="health-status unknown">UNKNOWN</span>
      <span id="health-ago" class="health-ago">no heartbeat yet</span>
    </div>
  </div>
</header>
<div class="main">
  <!-- Log Panel -->
  <div class="log-panel">
    <div class="tab-bar">
      <button class="active" data-tab="thoughts">Thoughts</button>
      <button data-tab="tools">Tools</button>
      <button data-tab="beliefs">Beliefs</button>
      <button data-tab="spatial">Spatial</button>
      <button data-tab="chat">Chat</button>
      <button data-tab="brain">🧠 Brain</button>
    </div>
    <div id="log-content" class="log-content"></div>
    <div id="chat-panel" class="chat-panel">
      <div id="chat-messages" class="chat-messages"></div>
      <div class="chat-input-bar">
        <input type="text" id="chat-sender" class="sender-input" placeholder="Name" />

    <div id="brain-panel" style="display:none;flex:1;flex-direction:column;background:#020408;position:relative;min-height:0;overflow:hidden">
      <canvas id="brain-canvas" style="display:block;width:100%;height:100%"></canvas>
      <div style="position:absolute;bottom:8px;left:12px;right:12px;pointer-events:none">
        <div id="brain-layer-bars" style="display:flex;gap:1px;align-items:flex-end;height:28px;margin-bottom:3px"></div>
        <div id="brain-stats" style="font-family:monospace;font-size:9px;color:#334155">waiting for first inference...</div>
      </div>

  <!-- 3D Scene -->
  <div class="scene-panel">
    <div class="scene-label">8D → 3D PCA PROJECTION</div>

    <div class="legend" id="legend"></div>

  <!-- Gauges -->
  <div class="gauge-panel">
    <div class="gauge-section">
      <h3>LAGRANGIAN GAUGES</h3>
      <div class="gauge">
        <div class="gauge-header"><span class="gauge-label">Ω Stability</span><span class="gauge-value" id="g-omega">—</span></div>
        <div class="gauge-bar"><div class="gauge-fill omega" id="gf-omega" style="width:50%"></div></div>
      </div>
      <div class="gauge">
        <div class="gauge-header"><span class="gauge-label">γ Inertia</span><span class="gauge-value" id="g-gamma">—</span></div>

      <div class="ekg-wrap">
        <canvas id="ekg-canvas" width="188" height="60"></canvas>

      <div class="act-event-row" id="act-last-belief">last belief: <span>—</span></div>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
               "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── State ──
let currentTab = 'thoughts';
let logTotal = { thoughts: 0, tools: 0, beliefs: 0, spatial: 0 };
const CAT_COLORS = {
  self_identity:'#FFD700', knowledge:'#4A9EFF', skills:'#4ADE80',
  capabilities:'#A78BFA', people:'#F472B6', preferences:'#FB923C',
  feedback:'#94A3B8', desires:'#E879F9', memory:'#475569', belief:'#666'
};

// ── Log Tabs ──
const logContent = document.getElementById('log-content');
const chatPanel = document.getElementById('chat-panel');

document.querySelectorAll('.tab-bar button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelector('.tab-bar button.active').classList.remove('active');
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    if (currentTab === 'chat') {
      logContent.style.display = 'none';
      chatPanel.classList.add('visible');
    } else {
      logContent.style.display = '';
      chatPanel.classList.remove('visible');
      logTotal[currentTab] = 0;
      logContent.innerHTML = '';
      fetchLogs();
    }
  });
});

function fetchLogs() {
  fetch(`/api/logs?tab=${currentTab}&since=${logTotal[currentTab]}`)
    .then(r => r.json())
    .then(data => {
      const el = document.getElementById('log-content');
      data.lines.forEach(line => {
        const div = document.createElement('div');
        div.className = 'log-line';
        if (/WARNING/i.test(line)) div.className += ' warn';
        if (/ERROR/i.test(line)) div.className += ' error';
        // Dim timestamp
        const tsMatch = line.match(/^(\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})/);
        if (tsMatch) {
          div.innerHTML = `<span class="ts">${tsMatch[1]}</span>${line.slice(tsMatch[1].length)}`;
        } else {
          div.textContent = line;
        }
        el.appendChild(div);
      });
      logTotal[currentTab] = data.total;
      el.scrollTop = el.scrollHeight;
    })
    .catch(() => {});
}

// ── Three.js Scene ──
const canvas = document.getElementById('three-canvas');
const container = canvas.parentElement;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0e17);
scene.fog = new THREE.FogExp2(0x0a0e17, 0.08);

const camera = new THREE.PerspectiveCamera(60, container.clientWidth / container.clientHeight, 0.1, 200);
camera.position.set(8, 6, 8);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.3;

// Lights
scene.add(new THREE.AmbientLight(0x334466, 0.6));
const dLight = new THREE.DirectionalLight(0xffffff, 0.8);
dLight.position.set(5, 10, 5);
scene.add(dLight);

// Grid
const grid = new THREE.GridHelper(20, 20, 0x1e293b, 0x111827);
grid.position.y = -0.5;
scene.add(grid);

// Point groups
let pointMeshes = [];
let pointData = [];

// Attention crosshair
const attnGeo = new THREE.OctahedronGeometry(0.25, 0);
const attnMat = new THREE.MeshStandardMaterial({
  color: 0x3b82f6, emissive: 0x3b82f6, emissiveIntensity: 0.8,
  transparent: true, opacity: 0.9
});
const attnMesh = new THREE.Mesh(attnGeo, attnMat);
scene.add(attnMesh);

// Trail line
const trailMat = new THREE.LineBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.4 });
const trailGeo = new THREE.BufferGeometry().setFromPoints([
  new THREE.Vector3(), new THREE.Vector3()
]);
const trailLine = new THREE.Line(trailGeo, trailMat);
scene.add(trailLine);

// Raycaster for hover
const raycaster = new THREE.Raycaster();
raycaster.params.Points = { threshold: 0.3 };
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  let hit = false;
  for (let i = 0; i < pointMeshes.length; i++) {
    const intersects = raycaster.intersectObject(pointMeshes[i]);
    if (intersects.length > 0) {
      const d = pointData[i];
      tooltip.innerHTML = `<strong>${d.category}</strong><br>${d.content || d.id}<br>mass: ${d.mass}`;
      tooltip.style.display = 'block';
      tooltip.style.left = (e.clientX - canvas.getBoundingClientRect().left + 12) + 'px';
      tooltip.style.top = (e.clientY - canvas.getBoundingClientRect().top - 10) + 'px';
      hit = true;
      break;
    }
  }
  if (!hit) tooltip.style.display = 'none';
});

function updateSpatial(data) {
  // Remove old meshes
  pointMeshes.forEach(m => { scene.remove(m); m.geometry.dispose(); m.material.dispose(); });
  pointMeshes = [];
  pointData = data.points || [];

  const seenCategories = new Set();

  data.points.forEach(p => {
    const radius = Math.max(0.08, Math.min(0.4, Math.sqrt(p.mass) * 0.25));
    const geo = p.type === 'memory'
      ? new THREE.SphereGeometry(0.05, 6, 6)
      : new THREE.SphereGeometry(radius, 12, 12);
    const color = new THREE.Color(p.color || '#666');
    const mat = new THREE.MeshStandardMaterial({
      color, emissive: color, emissiveIntensity: p.type === 'memory' ? 0.1 : 0.3,
      transparent: p.type === 'memory', opacity: p.type === 'memory' ? 0.35 : 0.85,
      roughness: 0.6,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(p.x, p.y, p.z);
    scene.add(mesh);
    pointMeshes.push(mesh);
    seenCategories.add(p.category);
  });

  // Update attention
  const a = data.attention;
  attnMesh.position.set(a.x, a.y, a.z);

  // Update trail
  const ap = data.attention_prev;
  const positions = trailLine.geometry.attributes.position;
  if (positions) {
    positions.setXYZ(0, ap.x, ap.y, ap.z);
    positions.setXYZ(1, a.x, a.y, a.z);
    positions.needsUpdate = true;
  }

  // Update legend
  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = '';
  seenCategories.forEach(cat => {
    if (cat === 'memory' || cat === 'belief') return;
    const item = document.createElement('span');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:${CAT_COLORS[cat]||'#666'}"></span>${cat}`;
    legendEl.appendChild(item);
  });

  document.getElementById('point-count').textContent = data.point_count;
}

function updateGauges(data) {
  document.getElementById('g-omega').textContent = data.omega.toFixed(3);
  document.getElementById('gf-omega').style.width = (data.omega * 100) + '%';
  document.getElementById('g-gamma').textContent = data.gamma.toFixed(3);
  document.getElementById('gf-gamma').style.width = ((data.gamma - 0.5) / 0.45 * 100) + '%';
  document.getElementById('pulse-num').textContent = data.pulse;

  const badge = document.getElementById('state-badge');
  badge.textContent = data.state;
  badge.className = 'status-badge ' + (data.state || '').toLowerCase();

  // ── Health indicator ──
  const dot    = document.getElementById('health-dot');
  const hstat  = document.getElementById('health-status');
  const hago   = document.getElementById('health-ago');
  const now    = Date.now() / 1000;
  const ts     = data.ts || 0;
  const ageSec = ts > 0 ? Math.floor(now - ts) : -1;

  let level, labelText, agoText;
  if (ts === 0) {
    level = 'unknown'; labelText = 'UNKNOWN'; agoText = 'no heartbeat file';
  } else if (ageSec < 1500) {        // < 25 min → alive (10 pulses × ~2min each)
    level = 'alive';   labelText = 'ALIVE';
    const m = Math.floor(ageSec / 60), s = ageSec % 60;
    agoText = m > 0 ? `${m}m ${s}s ago` : `${s}s ago`;
  } else if (ageSec < 2700) {        // 25–45 min → stale / busy
    level = 'stale';   labelText = 'SLOW';
    agoText = `${Math.floor(ageSec/60)}m ago — may be busy`;
  } else {                            // > 45 min → crashed
    level = 'crashed'; labelText = 'CRASHED';
    const mins = Math.floor(ageSec / 60);
    agoText = `last seen ${mins}m ago`;
  }

  dot.className   = 'health-dot ' + level;
  hstat.className = 'health-status ' + level;
  hstat.textContent = labelText;
  hago.textContent  = agoText;

  const catList = document.getElementById('cat-list');
  catList.innerHTML = '';
  if (data.beliefs && data.beliefs.categories) {
    Object.entries(data.beliefs.categories).sort((a,b) => b[1]-a[1]).forEach(([cat, count]) => {
      const li = document.createElement('li');
      li.className = 'cat-item';
      li.innerHTML = `<span class="cat-name"><span class="cat-dot" style="background:${CAT_COLORS[cat]||'#666'}"></span>${cat}</span><span class="cat-count">${count}</span>`;
      catList.appendChild(li);
    });
  }
}

// ── Chat System ──
// Start at current total so we only show NEW messages after page load
// (avoids flooding the chat with 200+ overnight autonomous thoughts)
let chatOutboundTotal = -1;  // -1 = uninitialized, will be set on first poll
const chatMessages = document.getElementById('chat-messages');
const chatInput = document.getElementById('chat-input');
const chatSender = document.getElementById('chat-sender');
const chatSendBtn = document.getElementById('chat-send');

// Persist sender name
chatSender.value = localStorage.getItem('helix_chat_sender') || 'Tester';
chatSender.addEventListener('change', () => {
  localStorage.setItem('helix_chat_sender', chatSender.value);
});

function appendChatMsg(sender, content, type, ts) {
  const div = document.createElement('div');
  div.className = 'chat-msg ' + type;
  const timeStr = ts ? new Date(ts * 1000).toLocaleTimeString() : new Date().toLocaleTimeString();
  div.innerHTML = `<span class="chat-sender">${sender}</span><span class="chat-time">${timeStr}</span><br>${content}`;
  chatMessages.appendChild(div);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function sendChatMessage() {
  const content = chatInput.value.trim();
  if (!content) return;
  const sender = chatSender.value.trim() || 'Tester';
  fetch('/api/messages', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ sender, content }),
  }).then(() => {
    appendChatMsg(sender, content, 'inbound');
    chatInput.value = '';
  }).catch(() => {});
}

chatSendBtn.addEventListener('click', sendChatMessage);
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendChatMessage();
});

function pollChatOutbound() {
  fetch(`/api/messages/outbound?since=${chatOutboundTotal < 0 ? 999999 : chatOutboundTotal}`)
    .then(r => r.json())
    .then(data => {
      if (chatOutboundTotal < 0) {
        // First poll: skip history, just record current position
        chatOutboundTotal = data.total || 0;
        const div = document.createElement('div');
        div.style.cssText = 'text-align:center;color:#475569;font-size:10px;padding:8px 0;border-top:1px solid #1e293b;margin-bottom:4px';
        div.textContent = `── chat started (${chatOutboundTotal} prior messages skipped) ──`;
        chatMessages.appendChild(div);
        return;
      }
      (data.messages || []).forEach(msg => {
        appendChatMsg('Helix', msg.content, 'outbound', msg.timestamp);
      });
      if (data.messages && data.messages.length > 0) {
        chatOutboundTotal = data.total || chatOutboundTotal;
      }
    })
    .catch(() => {});
}

setInterval(pollChatOutbound, 3000);

// ── Polling ──

// ── Activation Panel ──
const ekgCanvas = document.getElementById('ekg-canvas');
const ekgCtx = ekgCanvas.getContext('2d');
let fitnessHistory = [];

function drawEKG(history) {
  const w = ekgCanvas.width, h = ekgCanvas.height;
  ekgCtx.clearRect(0, 0, w, h);
  if (!history || history.length < 2) return;

  const min = Math.min(...history) - 0.05;
  const max = Math.max(...history) + 0.05;
  const range = Math.max(max - min, 0.05);

  // Grid lines
  ekgCtx.strokeStyle = '#1e293b';
  ekgCtx.lineWidth = 1;
  [0.25, 0.5, 0.75].forEach(frac => {
    const y = h - frac * h;
    ekgCtx.beginPath(); ekgCtx.moveTo(0, y); ekgCtx.lineTo(w, y); ekgCtx.stroke();
  });

  // Glow line
  ekgCtx.shadowColor = '#3b82f6';
  ekgCtx.shadowBlur = 8;
  ekgCtx.strokeStyle = '#7dd3fc';
  ekgCtx.lineWidth = 1.5;
  ekgCtx.beginPath();
  history.forEach((v, i) => {
    const x = (i / (history.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 8) - 4;
    i === 0 ? ekgCtx.moveTo(x, y) : ekgCtx.lineTo(x, y);
  });
  ekgCtx.stroke();
  ekgCtx.shadowBlur = 0;

  // Latest value dot
  const lv = history[history.length - 1];
  const lx = w - 2, ly = h - ((lv - min) / range) * (h - 8) - 4;
  ekgCtx.fillStyle = '#60a5fa';
  ekgCtx.shadowColor = '#3b82f6'; ekgCtx.shadowBlur = 10;
  ekgCtx.beginPath(); ekgCtx.arc(lx, ly, 3, 0, Math.PI*2); ekgCtx.fill();
  ekgCtx.shadowBlur = 0;

  // Fitness label
  ekgCtx.fillStyle = '#94a3b8'; ekgCtx.font = '9px monospace';
  ekgCtx.fillText(`fitness ${lv.toFixed(3)}`, 4, 10);
}

function updateActivations(data) {
  fitnessHistory = data.fitness_history || [];
  drawEKG(fitnessHistory);

  const barsEl = document.getElementById('act-bars');
  const components = data.active_components || {};
  barsEl.innerHTML = Object.entries(components).map(([name, level]) => {
    const pct = Math.round(level * 100);
    const cls = level > 0.5 ? 'high' : level === 0 ? 'zero' : '';
    return `<div class="act-bar-row">
      <div class="act-bar-label">${name}</div>
      <div class="act-bar-track"><div class="act-bar-fill ${cls}" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  const toolEl = document.getElementById('act-last-tool');
  toolEl.innerHTML = `last tool: <span>${data.last_tool || '—'}</span>`;
  const beliefEl = document.getElementById('act-last-belief');
  const bl = (data.last_belief || '').slice(0, 40);
  beliefEl.innerHTML = `last belief: <span>${bl || '—'}</span>`;
}

function pollActivations() {
  fetch('/api/activations').then(r => r.json()).then(updateActivations).catch(() => {});
}
pollActivations();
setInterval(pollActivations, 4000);

// ── 3D Brain Visualization ──────────────────────────────────────────────────
// Uses a separate plain canvas (no import needed) + raw WebGL via Three.js
// which is already imported above.

const brainCanvas = document.getElementById('brain-canvas');
const brainLayerBars = document.getElementById('brain-layer-bars');
const brainStats = document.getElementById('brain-stats');

// Set up Three.js scene for the brain
const brainRenderer = new THREE.WebGLRenderer({ canvas: brainCanvas, antialias: true, alpha: false });
brainRenderer.setPixelRatio(window.devicePixelRatio);
brainRenderer.setClearColor(0x020408, 1);

const brainScene = new THREE.Scene();
const brainCamera = new THREE.PerspectiveCamera(50, 1, 0.01, 100);
brainCamera.position.set(0, 0, 4.5);

const brainControls = new OrbitControls(brainCamera, brainCanvas);
brainControls.enableDamping = true;
brainControls.dampingFactor = 0.08;
brainControls.autoRotate = true;
brainControls.autoRotateSpeed = 0.4;
brainControls.enablePan = false;

// ── Colormap: clinical MRI hot (black → dark blue → blue → cyan → green → yellow → white)
function mriColor(t) {
  // t in [0, 1]
  const stops = [
    [0.00, [2,  4,  8]],
    [0.10, [0,  0, 40]],
    [0.25, [0,  0,160]],
    [0.40, [0,160,255]],
    [0.55, [0,220,160]],
    [0.70, [80,255, 60]],
    [0.82, [255,220,  0]],
    [0.92, [255,100,  0]],
    [1.00, [255,255,255]],
  ];
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const lo = stops[i-1], hi = stops[i];
      const frac = (t - lo[0]) / (hi[0] - lo[0]);
      return [
        (lo[1][0] + (hi[1][0]-lo[1][0])*frac) / 255,
        (lo[1][1] + (hi[1][1]-lo[1][1])*frac) / 255,
        (lo[1][2] + (hi[1][2]-lo[1][2])*frac) / 255,
      ];
    }
  }
  return [1,1,1];
}

// ── Build brain geometry: 32 layers × 40 points each in an ellipsoid
const N_LAYERS = 32;
const PTS_PER_LAYER = 40;
const TOTAL_PTS = N_LAYERS * PTS_PER_LAYER;

const positions = new Float32Array(TOTAL_PTS * 3);
const colors = new Float32Array(TOTAL_PTS * 3);
const layerOf = new Int32Array(TOTAL_PTS);  // which layer each point belongs to
const basePositions = new Float32Array(TOTAL_PTS * 3);  // for ripple animation

// Anatomical brain shape: stratified ellipsoid with cortical folding noise
// Layers 0-31 go from "brainstem" (bottom) to "frontal cortex" (top)
function brainNoise(x, y, z, freq) {
  // Simple deterministic noise for organic shape
  return Math.sin(x*freq*7.1 + 2.3) * Math.cos(y*freq*5.3 + 1.1) * Math.sin(z*freq*6.7 + 3.7) * 0.15;
}

let pidx = 0;
for (let li = 0; li < N_LAYERS; li++) {
  // Map layer 0→31 to vertical position: slight bottom-to-top gradient
  // with bulge in the middle (parietal) like a real brain
  const t = li / (N_LAYERS - 1);  // 0=brainstem, 1=frontal
  const yCenter = -0.8 + t * 1.6;   // vertical center of this layer slice

  // Brain is wider in the middle layers
  const widthScale = 0.4 + 0.7 * Math.sin(t * Math.PI);
  const depthScale = 0.35 + 0.6 * Math.sin(t * Math.PI * 0.8 + 0.3);

  for (let pi = 0; pi < PTS_PER_LAYER; pi++) {
    const angle = (pi / PTS_PER_LAYER) * Math.PI * 2;
    // Add radial variation — not all points at same radius
    const rVariation = 0.75 + 0.25 * Math.sin(angle * 3 + li * 0.4);
    const r = rVariation;

    let x = Math.cos(angle) * widthScale * r;
    let z = Math.sin(angle) * depthScale * r;
    let y = yCenter + brainNoise(x, yCenter, z, 2.5);

    // Add cortical folding noise
    x += brainNoise(x, y, z, 4.0) * widthScale;
    z += brainNoise(z, x, y, 3.5) * depthScale;

    const i3 = pidx * 3;
    positions[i3]   = basePositions[i3]   = x;
    positions[i3+1] = basePositions[i3+1] = y;
    positions[i3+2] = basePositions[i3+2] = z;
    layerOf[pidx] = li;
    pidx++;
  }
}

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

const mat = new THREE.PointsMaterial({
  size: 0.045,
  vertexColors: true,
  sizeAttenuation: true,
  transparent: true,
  opacity: 0.92,
});

const brainPoints = new THREE.Points(geo, mat);
brainScene.add(brainPoints);

// Ambient glow: subtle fog
brainScene.fog = new THREE.FogExp2(0x020408, 0.18);

// ── Neural activation state
let brainLayerActivations = new Float32Array(N_LAYERS).fill(0.05);
let brainPulseTs = 0;
let brainPulseN = 0;
let brainLastTs = 0;
let brainAnimTime = 0;
let brainRipple = 0;  // 0→1 ripple trigger on new data

function updateBrainColors(rippleFrac) {
  // rippleFrac: 0=no ripple, 1=full ripple (decays over time)
  for (let i = 0; i < TOTAL_PTS; i++) {
    const li = layerOf[i];
    const act = brainLayerActivations[li];

    // Ripple wave: a bright pulse that sweeps bottom→top
    const layerFrac = li / (N_LAYERS - 1);
    const rippleOffset = Math.abs(layerFrac - rippleFrac);
    const rippleBright = Math.max(0, 1 - rippleOffset * 8) * 0.6;

    const finalAct = Math.min(1.0, act + rippleBright);
    const [r, g, b] = mriColor(finalAct);

    const i3 = i * 3;
    colors[i3]   = r;
    colors[i3+1] = g;
    colors[i3+2] = b;
  }
  geo.attributes.color.needsUpdate = true;
}

function updateBrainLayerBarsUI() {
  if (!brainLayerBars) return;
  brainLayerBars.innerHTML = Array.from(brainLayerActivations).map((v, i) => {
    const [r, g, b] = mriColor(v);
    const hex = '#' + [r,g,b].map(c => Math.round(c*255).toString(16).padStart(2,'0')).join('');
    const h = Math.max(2, Math.round(v * 28));
    return `<div title="L${i}: ${v.toFixed(2)}" style="width:6px;height:${h}px;background:${hex};border-radius:1px;flex-shrink:0"></div>`;
  }).join('');
}

function pollNeural() {
  fetch('/api/neural').then(r => r.json()).then(data => {
    const layers = data.layers || [];
    if (layers.length === 0) return;
    // Blend new values in (smooth transition)
    for (let i = 0; i < N_LAYERS; i++) {
      const src = i < layers.length ? layers[i] : 0;
      brainLayerActivations[i] = brainLayerActivations[i] * 0.3 + src * 0.7;
    }
    if (data.ts && data.ts !== brainLastTs) {
      // New inference fired — trigger ripple
      brainLastTs = data.ts;
      brainRipple = 0;  // start ripple from bottom
      brainPulseN = data.pulse || 0;
      brainControls.autoRotateSpeed = 1.2;  // spin faster briefly
      setTimeout(() => { brainControls.autoRotateSpeed = 0.4; }, 2000);
    }
    const age = Date.now()/1000 - (data.ts || 0);
    if (data.ts > 0) {
      brainStats.textContent = `layer activations • pulse ${data.pulse} • ${data.token_count || '?'} tokens • ${age.toFixed(0)}s ago`;
      brainStats.style.color = '#475569';
    }
    updateBrainLayerBarsUI();
  }).catch(() => {});
}

// ── Animation loop
function animateBrain() {
  if (currentTab !== 'brain') {
    requestAnimationFrame(animateBrain);
    return;
  }

  brainAnimTime += 0.016;

  // Ripple sweep: 0→1 over 1.5 seconds
  if (brainRipple < 1.0) {
    brainRipple = Math.min(1.0, brainRipple + 0.011);
  }

  // Idle breathing: slow sine wave across layers
  const breathPhase = brainAnimTime * 0.4;
  const breathLayerActivations = new Float32Array(N_LAYERS);
  for (let i = 0; i < N_LAYERS; i++) {
    const base = brainLayerActivations[i];
    const breathe = base + 0.04 * Math.sin(breathPhase + i * 0.3);
    breathLayerActivations[i] = Math.max(0.02, Math.min(1.0, breathe));
  }
  // Temporarily override for animation
  const saved = brainLayerActivations.slice();
  brainLayerActivations.set(breathLayerActivations);
  updateBrainColors(brainRipple < 1.0 ? brainRipple : -1);
  brainLayerActivations.set(saved);

  // Resize canvas to panel size
  const parent = brainCanvas.parentElement;
  if (parent) {
    const w = parent.clientWidth, h = parent.clientHeight;
    if (brainCanvas.width !== w || brainCanvas.height !== h) {
      brainCanvas.width = w;
      brainCanvas.height = h;
      brainRenderer.setSize(w, h, false);
      brainCamera.aspect = w / h;
      brainCamera.updateProjectionMatrix();
    }
  }

  brainControls.update();
  brainRenderer.render(brainScene, brainCamera);
  requestAnimationFrame(animateBrain);
}

// ── Wire up Brain tab show/hide
const origTabSwitch = document.querySelectorAll('.tab-bar button');
origTabSwitch.forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    const brainPanel = document.getElementById('brain-panel');
    const logContent = document.getElementById('log-content');
    const chatPanel = document.getElementById('chat-panel');
    const scenePanel = document.querySelector('.scene-panel');

    if (tab === 'brain') {
      brainPanel.style.display = 'flex';
      logContent.style.display = 'none';
      chatPanel.style.display = 'none';
      if (scenePanel) scenePanel.style.display = 'none';
      pollNeural();
    } else {
      brainPanel.style.display = 'none';
      logContent.style.display = '';
      if (scenePanel) scenePanel.style.display = '';
    }
  });
});

// Initial brain setup
updateBrainColors(-1);
pollNeural();
setInterval(pollNeural, 2000);
animateBrain();
